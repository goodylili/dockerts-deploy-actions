name: Deploy to EC2

# Every push to main ships; workflow_dispatch re-runs the same deploy by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only ever one deploy in flight. Not cancel-in-progress: killing a half-applied
# rollout on the box is worse than letting it finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# packages: write is what lets GITHUB_TOKEN push images to GHCR.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    # Image refs are computed once here and consumed by the deploy job below.
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image references
        id: images
        run: |
          # GHCR requires a lowercase path; the owner/repo casing is not guaranteed.
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${REGISTRY}/${repo}/backend:${{ github.sha }}"   >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${repo}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"

      # Buildx is required for the type=gha layer cache used by the build steps.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # Immutable :sha tag is what the host deploys; :latest is a convenience
          # pointer for humans pulling by hand.
          tags: |
            ${{ steps.images.outputs.backend }}
            ${{ env.REGISTRY }}/${{ steps.images.outputs.repo }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}
            ${{ env.REGISTRY }}/${{ steps.images.outputs.repo }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    # Production environment: scopes the deploy secrets and any required approval.
    environment: production
    steps:
      # Only needed for the deploy/ files the next step uploads.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "deploy/docker-compose.prod.yml,deploy/deploy.sh"
          target: ${{ secrets.EC2_TARGET_DIR }}
          # Strips the deploy/ prefix so both files land directly in the target dir.
          strip_components: 1
          overwrite: true

      - name: Run deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          # Values are passed as env vars rather than interpolated into the script
          # body, so secrets never end up in the command line or shell history.
          envs: APP_DIR,REGISTRY,REGISTRY_USER,REGISTRY_TOKEN,BACKEND_IMAGE,FRONTEND_IMAGE,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_HOST_PORT,BACKEND_HOST_PORT,FRONTEND_HOST_PORT,CORS_ORIGINS,LOG_LEVEL
          script: bash "$APP_DIR/deploy.sh"
        env:
          APP_DIR: ${{ secrets.EC2_TARGET_DIR }}
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST_PORT: "5433"
          BACKEND_HOST_PORT: "8000"
          FRONTEND_HOST_PORT: "3000"
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          LOG_LEVEL: INFO

      # Records exactly which image tags went out, visible on the run page.
      - name: Summary
        run: |
          {
            echo "### Deployed to \`${{ secrets.EC2_HOST }}\`"
            echo ""
            echo "| Service | Image |"
            echo "| --- | --- |"
            echo "| backend | \`${{ needs.build.outputs.backend_image }}\` |"
            echo "| frontend | \`${{ needs.build.outputs.frontend_image }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
